services:  # api/frontend wait for this to finish before starting.
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-fraud-pipeline
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

  # FastAPI inference service.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: credit-fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully

  # Next.js demo UI. Calls the API from the browser at localhost:8000
  # (the published port above), not via the internal docker network,
  # since fetch() runs client-side in the user's browser.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: credit-fraud-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
